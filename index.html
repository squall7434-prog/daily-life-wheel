  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="theme-color" content="#121419">
  <meta name="description" content="今晚抽一次，明天少煩惱。單機版每日生活任務輪盤。">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon.svg">
  <style>
    :root {
      color-scheme: dark;
      --bg: #121419;
      --panel: #1b2028;
      --panel-soft: #222934;
      --text: #f4efe7;
      --muted: #b8b0a4;
      --line: rgba(255, 255, 255, 0.11);
      --primary: #c9a46a;
      --primary-strong: #e4bd7a;
      --ok: #7fc99b;
      --danger: #d88989;
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.28);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(201, 164, 106, 0.16), transparent 34rem),
        linear-gradient(180deg, #111318 0%, #171b22 52%, #101216 100%);
      color: var(--text);
      font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.65;
    }

    button,
    input {
      font: inherit;
    }

    .app {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 42px 0 56px;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 24px;
      align-items: end;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.1rem, 6vw, 4.5rem);
      letter-spacing: 0;
      line-height: 1.08;
    }

    .subtitle {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 1.08rem;
    }

    .date-pill {
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.06);
      border-radius: 999px;
      padding: 10px 16px;
      color: var(--muted);
      white-space: nowrap;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(27, 32, 40, 0.78);
      box-shadow: var(--shadow);
      margin-bottom: 18px;
    }

    .btn {
      border: 0;
      border-radius: 8px;
      padding: 12px 18px;
      color: #17120c;
      background: var(--primary);
      cursor: pointer;
      min-height: 46px;
      font-weight: 700;
      transition: transform 160ms ease, background 160ms ease, opacity 160ms ease;
    }

    .btn:hover {
      background: var(--primary-strong);
      transform: translateY(-1px);
    }

    .btn.secondary {
      background: var(--panel-soft);
      color: var(--text);
      border: 1px solid var(--line);
    }

    .btn.secondary:hover {
      background: #2b3441;
    }

    .btn.danger {
      background: transparent;
      color: var(--danger);
      border: 1px solid rgba(216, 137, 137, 0.42);
    }

    .btn.danger:hover {
      background: rgba(216, 137, 137, 0.11);
    }

    .settings {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-left: auto;
    }

    .day-type {
      display: inline-flex;
      gap: 6px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.04);
    }

    .day-type label {
      position: relative;
      display: inline-flex;
      align-items: center;
      min-height: 36px;
      padding: 7px 13px;
      border-radius: 7px;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
    }

    .day-type input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .day-type label:has(input:checked) {
      background: var(--primary);
      color: #17120c;
      font-weight: 700;
    }

    .check-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 42px;
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.04);
      cursor: pointer;
      user-select: none;
    }

    .check-chip input {
      width: 16px;
      height: 16px;
      accent-color: var(--primary);
    }

    .status {
      margin: 0 0 18px;
      color: var(--muted);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 26px;
    }

    .task-card {
      min-height: 230px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(27, 32, 40, 0.9);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 12px 34px rgba(0, 0, 0, 0.18);
    }

    .task-card.done {
      border-color: rgba(127, 201, 155, 0.42);
      background: rgba(31, 57, 44, 0.54);
    }

    .task-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .task-type {
      color: var(--primary-strong);
      font-size: 0.9rem;
      font-weight: 700;
    }

    .done-box {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.05);
      cursor: pointer;
      flex: 0 0 auto;
    }

    .done-box input {
      width: 17px;
      height: 17px;
      accent-color: var(--ok);
      cursor: pointer;
    }

    .task-title {
      margin: 0;
      font-size: 1.22rem;
      line-height: 1.28;
      letter-spacing: 0;
    }

    .task-detail {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: auto;
    }

    .tag {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 9px;
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.45;
      background: rgba(255, 255, 255, 0.04);
    }

    .notice {
      border-left: 3px solid var(--primary);
      padding: 10px 12px;
      margin: 0;
      color: var(--muted);
      background: rgba(201, 164, 106, 0.08);
      border-radius: 0 8px 8px 0;
      font-size: 0.92rem;
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      margin: 28px 0 12px;
    }

    h2 {
      margin: 0;
      font-size: 1.28rem;
      letter-spacing: 0;
    }

    .small {
      color: var(--muted);
      font-size: 0.92rem;
    }

    .history-list {
      display: grid;
      gap: 10px;
    }

    .history-item {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(27, 32, 40, 0.72);
      overflow: hidden;
    }

    .history-button {
      width: 100%;
      border: 0;
      color: var(--text);
      background: transparent;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      cursor: pointer;
      text-align: left;
    }

    .history-summary {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .history-detail {
      display: none;
      padding: 0 16px 16px;
      color: var(--muted);
    }

    .history-item.open .history-detail {
      display: block;
    }

    .history-detail ul {
      margin: 0;
      padding-left: 1.1rem;
    }

    .history-checks {
      display: grid;
      gap: 8px;
      margin: 0 0 12px;
    }

    .history-checks label {
      display: grid;
      grid-template-columns: 18px minmax(0, 1fr);
      gap: 10px;
      align-items: start;
      color: var(--muted);
      cursor: pointer;
    }

    .history-checks input {
      width: 16px;
      height: 16px;
      margin-top: 4px;
      accent-color: var(--ok);
    }

    .empty {
      border: 1px dashed var(--line);
      border-radius: 8px;
      padding: 28px;
      color: var(--muted);
      text-align: center;
      background: rgba(255, 255, 255, 0.03);
    }

    @media (max-width: 1060px) {
      .grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 720px) {
      .app {
        width: min(100% - 22px, 680px);
        padding-top: 26px;
      }

      .hero {
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .date-pill {
        justify-self: start;
        white-space: normal;
      }

      .toolbar {
        padding: 14px;
      }

      .btn {
        width: 100%;
      }

      .settings {
        width: 100%;
        margin-left: 0;
      }

      .day-type {
        width: 100%;
      }

      .day-type label {
        flex: 1;
        justify-content: center;
      }

      .check-chip {
        width: 100%;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .task-card {
        min-height: 0;
      }
    }
  </style>
</head>

    const cashLow = document.querySelector("#cashLow");

    function loadState() {
      const emptyState = {
        current: null,
        history: [],
        settings: { dayType: "weekday", budgetOk: false, boughtTwice: false, cashLow: false }
      };
      try {
        const stored = JSON.parse(localStorage.getItem(STORAGE_KEY));
        return {
          ...emptyState,
          ...stored,
          settings: { ...emptyState.settings, ...(stored && stored.settings ? stored.settings : {}) }
        };
      } catch (error) {
        return emptyState;
      }
    }

    function saveState(nextState) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(nextState));
    }

    function weightedPick(items) {
      const total = items.reduce((sum, item) => sum + item.weight, 0);
      let cursor = Math.random() * total;
      for (const item of items) {
        cursor -= item.weight;
        if (cursor <= 0) return item;
      }
      return items[items.length - 1];
    }

    function randomPick(items) {
      return items[Math.floor(Math.random() * items.length)];
    }

    function isoDate(offsetDays = 0) {
      const date = new Date();
      date.setHours(12, 0, 0, 0);
      date.setDate(date.getDate() + offsetDays);
      return date.toISOString().slice(0, 10);
    }

    function formatDate(dateString) {
      return new Intl.DateTimeFormat("zh-TW", {
        month: "long",
        day: "numeric",
        weekday: "long"
      }).format(new Date(`${dateString}T12:00:00`));
    }

    function readSettings() {
      const checkedDayType = document.querySelector("input[name='dayType']:checked");
      return {
        dayType: checkedDayType ? checkedDayType.value : "weekday",
        budgetOk: budgetOk.checked,
        boughtTwice: boughtTwice.checked,
        cashLow: cashLow.checked
      };
    }

    function applySettings(settings) {
      const dayType = settings.dayType || "weekday";
      dayTypeInputs.forEach(input => {
        input.checked = input.value === dayType;
      });
      budgetOk.checked = Boolean(settings.budgetOk);
      boughtTwice.checked = Boolean(settings.boughtTwice);
      cashLow.checked = Boolean(settings.cashLow);
    }

    function profileFor(dayType) {
      return wheelData.dayProfiles[dayType] || wheelData.dayProfiles.weekday;
    }

    function weightedFor(dayType, key) {
      const profile = profileFor(dayType);
      return weightedPick(profile[key] || wheelData[key]);
    }

    function buildInvestmentTask(settings) {
      const etf = weightedPick(wheelData.etfs).value;
      const shouldPause = settings.boughtTwice || settings.cashLow;
      const shares = settings.budgetOk ? 2 : 1;

      return {
        title: shouldPause ? "投資觀察日" : `投資執行：${etf}`,
        detail: shouldPause
          ? "今日暫停買進，只做觀察。原因可能是本週已買 2 次以上或現金水位偏低。"
          : `提醒：${etf}，買 ${shares} 張。執行前仍需自行確認價格、資金與風險。`,
        tags: shouldPause ? ["暫停買進", `原抽中 ${etf}`] : [`ETF ${etf}`, `買 ${shares} 張`],
        notice: "本工具只負責降低決策疲勞，不構成投資建議，也不會自動交易。"
      };
    }

    function generatePackage() {
      const settings = readSettings();
      const dayType = settings.dayType || "weekday";
      const dayProfile = profileFor(dayType);
      const tomorrow = isoDate(1);
      const exerciseMinutes = weightedFor(dayType, "exerciseMinutes").value;
      const exercisePlan = wheelData.exercisePlanByMinutes[exerciseMinutes];
      const japanese = weightedPick(wheelData.japaneseTasks);
      const floating = weightedFor(dayType, "floatingTasks").value;
      const floatingPayload = floating === "寫作 500 字"
        ? {
            title: "寫作 500 字",
            detail: randomPick(wheelData.writingTopics),
            tags: dayType === "holiday" ? ["假日浮動", "500 字短文", "假日不抽投資"] : ["浮動任務", "500 字短文"]
          }
        : buildInvestmentTask(settings);

      const tasks = [
        {
          id: "exercise",
          type: "固定任務",
          title: `運動 ${exerciseMinutes} 分鐘`,
          detail: `${randomPick(wheelData.strengthTypes)}；${randomPick(wheelData.cardioTypes)}`,
          tags: [`無氧 ${exercisePlan.strength} 分鐘`, `有氧 ${exercisePlan.cardio} 分鐘`]
        },
        {
          id: "reading",
          type: "固定任務",
          title: `閱讀 ${weightedFor(dayType, "readingMinutes").value} 分鐘`,
          detail: "從現有 Kobo 與實體書中選一本最容易開始的書。",
          tags: ["只決定時間", "降低開始成本"]
        },
        {
          id: "japanese",
          type: "固定任務",
          title: `日語：${japanese.value}`,
          detail: japanese.description,
          tags: [`${weightedFor(dayType, "japaneseMinutes").value} 分鐘`]
        },
        {
          id: "english",
          type: "固定任務",
          title: "英語學習",
          detail: randomPick(wheelData.englishTasks),
          tags: ["英文", "隨機任務"]
        },
        {
          id: "cleaning",
          type: "固定任務",
          title: `打掃 ${weightedFor(dayType, "cleaningMinutes").value} 分鐘`,
          detail: randomPick(wheelData.cleaningAreas),
          tags: ["只處理一區"]
        },
        {
          id: "meditation",
          type: "固定任務",
          title: `靜坐冥想 ${weightedPick(wheelData.meditationMinutes).value} 分鐘`,
          detail: "坐好，注意呼吸。分心時不責備自己，只把注意力帶回呼吸。",
          tags: ["呼吸", "回到當下"]
        },
        {
          id: "floating",
          type: "浮動任務",
          ...floatingPayload
        },
        {
          id: "drama",
          type: "獎勵任務",
          title: `追劇 ${weightedFor(dayType, "dramaMinutes").value} 分鐘`,
          detail: "完成主要任務後再享用，讓獎勵更有儀式感。",
          tags: ["獎勵", "放鬆"]
        }
      ].map(task => ({ ...task, done: false }));

      const state = loadState();
      const packageData = {
        id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()),
        date: tomorrow,
        dayType,
        dayTypeLabel: dayProfile.label,
        createdAt: new Date().toISOString(),
        settings,
        tasks
      };

      const history = [packageData, ...state.history.filter(item => item.date !== tomorrow)].slice(0, HISTORY_LIMIT);
      saveState({ current: packageData, history, settings });
      render();
    }

    function updateTaskDone(taskId, done) {
      const state = loadState();
      if (!state.current) return;

      state.current.tasks = state.current.tasks.map(task => task.id === taskId ? { ...task, done } : task);
      state.history = [state.current, ...state.history.filter(item => item.id !== state.current.id && item.date !== state.current.date)]
        .slice(0, HISTORY_LIMIT);
      saveState(state);
      render();
    }

    function updateHistoryTaskDone(packageId, taskId, done) {
      const state = loadState();
      state.history = (state.history || []).map(item => {
        if (item.id !== packageId) return item;
        return {
          ...item,
          tasks: item.tasks.map(task => task.id === taskId ? { ...task, done } : task)
        };
      });

      if (state.current && state.current.id === packageId) {
        const updatedCurrent = state.history.find(item => item.id === packageId);
        if (updatedCurrent) state.current = updatedCurrent;
      }

      saveState(state);
      render();
    }

    function persistSettings() {
      const state = loadState();
      state.settings = readSettings();
      saveState(state);
    }

    function renderTasks(current) {
      if (!current) {
        taskGrid.innerHTML = `<div class="empty" style="grid-column: 1 / -1;">按下「產生明日任務包」，今晚就把明天的決策先收好。</div>`;
        return;
      }

      taskGrid.innerHTML = current.tasks.map(task => `
        <article class="task-card ${task.done ? "done" : ""}">
          <div class="task-top">
            <div class="task-type">${task.type}</div>
            <label class="done-box" title="標記完成">
              <input type="checkbox" data-task-done="${task.id}" ${task.done ? "checked" : ""} aria-label="${task.title}完成狀態">
            </label>
          </div>
          <h3 class="task-title">${task.title}</h3>
          <p class="task-detail">${task.detail}</p>
          ${task.notice ? `<p class="notice">${task.notice}</p>` : ""}
          <div class="meta">${task.tags.map(tag => `<span class="tag">${tag}</span>`).join("")}</div>
        </article>
      `).join("");

      taskGrid.querySelectorAll("[data-task-done]").forEach(input => {
        input.addEventListener("change", event => updateTaskDone(event.target.dataset.taskDone, event.target.checked));
      });
    }

    function renderHistory(history) {
      if (!history.length) {
        historyList.innerHTML = `<div class="empty">目前沒有歷史紀錄。</div>`;
        return;
      }

      historyList.innerHTML = history.map(item => {
        const doneCount = item.tasks.filter(task => task.done).length;
        const summary = item.tasks.map(task => task.title).join("｜");
        const dayLabel = item.dayTypeLabel || profileFor(item.dayType || "weekday").label;
        return `
          <article class="history-item">
            <button class="history-button" type="button">
              <span>
                <strong>${formatDate(item.date)}</strong><br>
                <span class="history-summary">${dayLabel}｜${doneCount}/${item.tasks.length} 完成</span>
              </span>
              <span class="small">展開</span>
            </button>
            <div class="history-detail">
              <div class="history-checks">
                ${item.tasks.map(task => `
                  <label>
                    <input type="checkbox" data-history-package="${item.id}" data-history-task="${task.id}" ${task.done ? "checked" : ""}>
                    <span>${task.title}：${task.detail}</span>
                  </label>
                `).join("")}
              </div>
              <p class="small">${summary}</p>
            </div>
          </article>
        `;
      }).join("");

      historyList.querySelectorAll(".history-button").forEach(button => {
        button.addEventListener("click", () => button.closest(".history-item").classList.toggle("open"));
      });

      historyList.querySelectorAll("[data-history-package]").forEach(input => {
        input.addEventListener("change", event => {
          updateHistoryTaskDone(
            event.target.dataset.historyPackage,
            event.target.dataset.historyTask,
            event.target.checked
          );
        });
      });
    }

    function render() {
      const state = loadState();
      applySettings(state.settings || {});
      targetDateText.textContent = `目標日：${formatDate(isoDate(1))}`;

      if (state.current) {
        const doneCount = state.current.tasks.filter(task => task.done).length;
        const dayLabel = state.current.dayTypeLabel || profileFor(state.current.dayType || "weekday").label;
        statusText.textContent = `目前顯示 ${formatDate(state.current.date)} 的${dayLabel}任務包，完成進度 ${doneCount}/${state.current.tasks.length}。`;
      } else {
        statusText.textContent = "尚未產生任務包。投資只會產生提醒，不串接券商 API，也不會自動交易。";
      }

      renderTasks(state.current);
      renderHistory(state.history || []);
    }

    generateBtn.addEventListener("click", generatePackage);
    rerollBtn.addEventListener("click", generatePackage);
    clearBtn.addEventListener("click", () => {
      if (!confirm("確定要清除目前任務與最近 14 天歷史紀錄嗎？")) return;
      localStorage.removeItem(STORAGE_KEY);
      applySettings({});
      render();
    });

    [...dayTypeInputs, budgetOk, boughtTwice, cashLow].forEach(input => {
      input.addEventListener("change", persistSettings);
    });

    if ("serviceWorker" in navigator && location.protocol !== "file:") {
      navigator.serviceWorker.register("./sw.js").catch(() => {
        // 靜態部署環境若不支援 service worker，頁面仍可正常使用。
      });
    }

    render();
  </script>
</body>
</html>
